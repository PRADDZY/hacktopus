name = "fairlens-api-worker"
main = "src/index.ts"
compatibility_date = "2026-03-24"
workers_dev = true

[vars]
AUTH_REQUIRED = "true"
AUTH_ROLE_CLAIM = "https://fairlens.ai/roles"
AUTH_ADMIN_ROLES = "admin"
AUTH_JWT_ALGORITHMS = "RS256"
SUPABASE_REST_SCHEMA = "public"
RISK_APPROVAL_THRESHOLD = "0.55"
MODEL_VERSION = "worker-baseline-v1"
IDEMPOTENCY_TTL_SECONDS = "86400"
# MODAL_EXTRACTION_ENDPOINT should be set per environment if using async extraction dispatch.
# Set secrets with:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put MODAL_EXTRACTION_TOKEN
#   wrangler secret put EXTRACTION_CALLBACK_SECRET
