name = "fairlens-api-worker"
main = "src/index.ts"
compatibility_date = "2026-03-24"
workers_dev = true
account_id = "0f29b8c67d98ac571ea8874d8b3c7345"

[vars]
AUTH_REQUIRED = "true"
AUTH_AUDIENCE = "authenticated"
AUTH_ROLE_CLAIM = "https://fairlens.ai/roles"
AUTH_ADMIN_ROLES = "admin"
AUTH_JWT_ALGORITHMS = "ES256,RS256,HS256"
CORS_ALLOWED_ORIGINS = "https://fairlens-frontend.dpratik3005.workers.dev,http://localhost:3000"
SUPABASE_URL = "https://qwwgfdfdbseemoiwkxbk.supabase.co"
SUPABASE_REST_SCHEMA = "public"
RISK_APPROVAL_THRESHOLD = "0.55"
MODEL_VERSION = "worker-baseline-v1"
MODEL_SCORING_ENDPOINT = "https://superhexagon2021--fairlens-ml-api-api.modal.run/predict"
FEATURE_EXTRACTION_ENDPOINT = "https://superhexagon2021--fairlens-ml-api-api.modal.run/featureize/statement"
MODAL_EXTRACTION_ENDPOINT = "https://superhexagon2021--fairlens-ml-api-api.modal.run/extract"
OPENROUTER_PRIMARY_MODEL = "nvidia/nemotron-3-super-120b-a12b:free"
OPENROUTER_FALLBACK_MODEL = "minimax/minimax-m2.5:free"
OPENROUTER_SITE_URL = "https://fairlens-frontend.dpratik3005.workers.dev"
OPENROUTER_APP_NAME = "FairLens Demo"
IDEMPOTENCY_TTL_SECONDS = "86400"
# Set WORKER_SCORING_FALLBACK_ENABLED="true" only for local resiliency testing.
# For demo/prod, keep strict scoring by leaving fallback disabled.
# MODEL_SCORING_ENDPOINT should point to ML service base URL or /predict URL for assessment scoring.
# FEATURE_EXTRACTION_ENDPOINT can point to ML /featureize/statement (defaults from MODEL_SCORING_ENDPOINT if omitted).
# MODAL_EXTRACTION_ENDPOINT should be set per environment if using async extraction dispatch.
# AI_ASSISTANT_ENDPOINT can point to a remote LLM service; if omitted, worker uses rule-based assistant.
# For OpenRouter assistant routing, set:
#   OPENROUTER_PRIMARY_MODEL = "provider/model"
#   OPENROUTER_FALLBACK_MODEL = "provider/model" (optional)
#   OPENROUTER_SITE_URL = "https://your-frontend.example.com" (optional, recommended)
#   OPENROUTER_APP_NAME = "FairLens Demo" (optional)
# Set secrets with:
#   wrangler secret put SUPABASE_JWT_SECRET
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put MODEL_SCORING_TOKEN
#   wrangler secret put FEATURE_EXTRACTION_TOKEN
#   wrangler secret put MODAL_EXTRACTION_TOKEN
#   wrangler secret put EXTRACTION_CALLBACK_SECRET
#   wrangler secret put AI_ASSISTANT_TOKEN
#   wrangler secret put OPENROUTER_API_KEY
